name: CI/CD Pipeline - Flight Clustering System

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run health check
      run: |
        python scripts/health_check.py || echo "Health check completed"
    
    - name: Check model files
      run: |
        if [ -f "models/flight_cluster_model.pkl" ]; then
          echo "✅ Model file exists"
        else
          echo "⚠️  Model file not found (will be created on deployment)"
        fi

  train-model:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Train model
      run: |
        if [ -f "DATA SET VUELOS - 70 000.csv" ]; then
          python train_model.py
          echo "✅ Model training completed"
        else
          echo "⚠️  Dataset not found in repository (will be available on Railway)"
        fi
    
    - name: Upload model artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: trained-models
        path: models/
        retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [test]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Railway
      run: |
        echo "🚀 Deployment triggered"
        echo "Railway will automatically deploy from GitHub"
        echo "Make sure Railway is connected to this repository"
